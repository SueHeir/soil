name: docs-coverage

# Public-API documentation gate. Every SOIL library crate opts in with
# `#![warn(missing_docs)]`; this workflow flips that warning to a hard error
# (`-D warnings`) so no public item can merge without a doc comment.
#
# Runner note: SOIL depends on the GRASS framework via a git dependency
# (`https://github.com/SueHeir/grass.git`), so the runner must be
# able to fetch that repo (the same SSH access the dev environment uses). The
# default feature set links libmpi, hence the OpenMPI install below.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  missing-docs:
    name: missing_docs gate (deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # soil_core's default feature `mpi_backend` links libmpi.
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Scoped to `--lib` so the gate covers the crates' public surface only,
      # not examples/tests/binaries.
      - name: cargo build (workspace libs, docs = deny)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --workspace --lib
