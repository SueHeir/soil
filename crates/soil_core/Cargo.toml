[package]
name = "soil_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core simulation infrastructure: TOML config, domain decomposition, MPI communication, atom data structures"
keywords = ["dem", "simulation", "mpi", "domain-decomposition"]
categories = ["simulation", "science"]

[features]
default = ["mpi_backend", "precision-double"]
mpi_backend = ["grass_mpi/mpi_backend"]

# Mutually-exclusive precision configs (see src/precision.rs). Exactly one must
# be active; the default feature set selects `precision-double`.
precision-double = []
precision-mixed = []
precision-single = []

[dependencies]
grass_scheduler = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
grass_app = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
grass_mpi = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main", default-features = false }
grass_derive = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
grass_io = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"

# ── Examples ─────────────────────────────────────────────────────────────────
# MPI validation of forward_comm_overlap (roadmap step 4, comm/compute overlap):
# an LJ gas whose overlapped force must match the non-overlapped force to the
# FP floor across rank layouts. Requires the MPI backend (default feature).
[[example]]
name = "overlap_forward_validate"
path = "examples/overlap_forward_validate/main.rs"
required-features = ["mpi_backend", "precision-double"]

# DSMC rarefied-gas thermal relaxation: SOIL owns particle state + cell binning;
# the example adds only a Maxwell-molecule stochastic collision step and compares
# the temperature-anisotropy decay to the published BGK exponential reference.
[[example]]
name = "dsmc_thermal_relaxation"
path = "examples/dsmc_thermal_relaxation/main.rs"
required-features = ["precision-double"]
