[package]
name = "soil_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core simulation infrastructure: TOML config, domain decomposition, MPI communication, atom data structures"
keywords = ["dem", "simulation", "mpi", "domain-decomposition"]
categories = ["simulation", "science"]

[features]
default = ["mpi_backend", "precision-double"]
mpi_backend = ["grass_mpi/mpi_backend"]

# Mutually-exclusive precision configs (see src/precision.rs). Exactly one must
# be active; the default feature set selects `precision-double`.
precision-double = []
precision-mixed = []
precision-single = []

[dependencies]
grass_scheduler.workspace = true
grass_app.workspace = true
grass_mpi = { workspace = true, default-features = false }
grass_derive.workspace = true
grass_io.workspace = true
serde.workspace = true
toml.workspace = true
rand.workspace = true

[dev-dependencies]
soil_derive = { path = "../soil_derive", version = "0.1.3" }
