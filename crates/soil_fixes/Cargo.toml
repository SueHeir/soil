[package]
name = "soil_fixes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Method-agnostic position/velocity constraints for SOIL (e.g. pin)"
keywords = ["constraint", "fix", "dem", "simulation"]
categories = ["simulation", "science"]

[features]
# Forward the precision config to soil_core. Exactly one must be active.
default = ["precision-double"]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]

[dependencies]
soil_core = { path = "../soil_core", version = "0.1.4", default-features = false }
grass_app.workspace = true
grass_scheduler.workspace = true
serde.workspace = true
