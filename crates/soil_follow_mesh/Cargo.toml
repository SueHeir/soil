[package]
name = "soil_follow_mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Make SOIL split its particles exactly where a FIELD mesh splits its cells, so particle-grid methods (MPM, PIC) keep each particle on the rank that holds its cells."
publish = false

[features]
default = ["precision-double"]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]
mpi_backend = ["soil_core/mpi_backend", "field_core/mpi_backend"]

[dependencies]
soil_core = { path = "../soil_core", version = "0.1.3", default-features = false }
grass_app.workspace = true
grass_mpi.workspace = true
field_core = { git = "https://github.com/SueHeir/field.git", branch = "main" }

[dev-dependencies]
grass_io.workspace = true
