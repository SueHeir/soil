# overlap_forward_validate — multi-rank layout (2×2×1).
# Periodic box sized so the 2.5σ ghost halo never wraps onto itself.
# Full neighbour list (newton = false): each atom owns its whole force, so the
# interior/boundary split preserves per-atom accumulation order exactly.

[comm]
processors_x = 2
processors_y = 2
processors_z = 1

[domain]
x_low = 0.0
x_high = 17.95939277294997
y_low = 0.0
y_high = 17.95939277294997
z_low = 0.0
z_high = 17.95939277294997
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.15
bin_size = 1.5
every = 1
newton = false
